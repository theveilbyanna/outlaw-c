<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Outlaw Cut Pro</title>

<style>
/* Layout: editor stack for a phone. Sticky monitor + transport on top, horizontal timeline under it, then a tool dock whose panel changes with the selected tool or item. */
:root{
  --ink:#141016;--panel:#1e1820;--panel-2:#2a222c;--line:#3d3240;
  --bone:#efe5d8;--dim:#ab9ca8;--rose:#ff5c8a;--brass:#e3b55a;--ok:#73d6a0;--bad:#ff806f;--sky:#6fb8ff;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{background:var(--ink)}
body{background:var(--ink);color:var(--bone);font:16px/1.45 var(--body);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 80px}
@media (min-width:600px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font:400 clamp(22px,6.5vw,32px)/1 var(--display);margin:0}
h1 span{color:var(--rose)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:6px;display:grid;gap:6px}
.stagebox{display:flex;justify-content:center}
#stage{display:block;max-width:100%;max-height:40vh;width:auto;height:auto;background:#000;border-radius:8px;border:1px solid var(--line);touch-action:none}
.transport{display:flex;align-items:center;gap:8px}
.time{font:500 13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.tlwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;min-width:0}
.tl{overflow-x:auto;position:relative;padding:0 12px;scrollbar-width:thin}
.tlin{position:relative;min-height:112px}
.ruler{height:16px;position:relative;font:500 10px var(--mono);color:var(--dim)}
.ruler i{position:absolute;top:0;border-left:1px solid var(--line);height:8px;padding-left:2px;font-style:normal}
.lane{position:relative;height:46px;margin-top:4px}
.lane.small{height:22px}
.blk{position:absolute;top:0;bottom:0;border-radius:8px;border:2px solid transparent;background:var(--panel-2) center/cover;overflow:hidden;cursor:pointer;color:#fff;font:600 11px var(--body);display:flex;align-items:flex-end;padding:3px 5px;box-sizing:border-box;text-shadow:0 1px 2px #000}
.blk.sel{border-color:var(--brass)}
.bar{position:absolute;top:2px;bottom:2px;border-radius:6px;font:600 11px var(--body);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-sizing:border-box;color:var(--ink);line-height:18px}
.bar.text{background:var(--rose)}.bar.sticker{background:var(--brass)}.bar.audio{background:var(--sky)}
.bar.sel{outline:2px solid #fff}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;box-shadow:0 0 6px #fff8}
.tlbar{display:flex;justify-content:space-between;align-items:center;padding:0 12px 6px;gap:6px}
.dock{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dock button{flex:0 0 auto;min-width:68px;min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--bone);font:700 12px var(--body);display:grid;place-items:center;gap:2px;padding:6px 8px;cursor:pointer}
.dock button b{font-size:20px;line-height:1}
.dock button[aria-pressed="true"]{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font:400 15px var(--display);color:var(--brass)}
.hint{margin:0;color:var(--dim);font-size:14px}
.hint a{color:var(--brass)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
label,.lbl{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;box-sizing:border-box;background:var(--panel-2);color:var(--bone);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px var(--body);min-height:44px}
textarea{resize:vertical;min-height:60px}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:2px}
input[type=range]{accent-color:var(--rose);width:100%}
input[type=checkbox]{accent-color:var(--rose);width:20px;height:20px}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--bone);text-transform:none;letter-spacing:0;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--bone);font:700 15px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--ink);font-weight:800}
.btn.big{min-height:54px;width:100%;font-size:17px}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.picker{display:block;width:100%;box-sizing:border-box;background:var(--panel-2);color:var(--bone);border:1px dashed var(--brass);border-radius:10px;padding:12px;font:16px var(--body);min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);color:var(--bone);font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.emoji{font-size:26px;min-width:48px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tpl button{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--bone);cursor:pointer;display:grid;place-items:center;padding:10px;text-align:center;gap:4px}
.tpl button b{font-size:20px;line-height:1.1}
.tpl button small{color:var(--dim);font-size:12px}
.status{font-size:13px;color:var(--dim)}
.status.err{color:var(--bad)}.status.good{color:var(--ok)}
.result{display:grid;gap:8px}
.result video{max-width:100%;max-height:45vh;border-radius:10px;background:#000;justify-self:center}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,16,22,.94);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.overlay .box{max-width:420px;width:100%;display:grid;gap:14px;text-align:center}
.pbar{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--rose)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--bone);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:700;max-width:90vw}
.empty{color:var(--dim);margin:0;text-align:center;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>OUTLAW CUT <span>PRO</span></h1>

  <div class="top">

    <div class="transport">

</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=s-m*60;return m+':'+(x<10?'0':'')+x.toFixed(1)};
const fmt0=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')};
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- audio ---------- */
let ac=null,master=null,mix=null;
function audio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);mix=ac.createGain();mix.connect(master)}if(ac.state==='suspended')ac.resume();return ac}
function synth(sec,fn){const sr=ac.sampleRate,n=Math.floor(sec*sr),b=ac.createBuffer(1,n,sr);fn(b.getChannelData(0),sr,n);return b}
const rnd=()=>Math.random()*2-1;
const SFX={
 whoosh:['Whoosh',()=>synth(1.1,(d,sr,n)=>{let y=0;for(let i=0;i<n;i++){const t=i/n,e=Math.pow(Math.sin(Math.PI*t),2);y+=(.02+.3*e)*(rnd()-y);d[i]=y*e*2.6}})],
 boom:['Boom',()=>synth(1.8,(d,sr,n)=>{let p=0;for(let i=0;i<n;i++){const t=i/sr;p+=2*Math.PI*(38+95*Math.exp(-t*7))/sr;d[i]=Math.sin(p)*Math.exp(-t*2.2)*.95+rnd()*Math.exp(-t*50)*.5}})],
 riser:['Riser',()=>synth(1.8,(d,sr,n)=>{let p=0,l=0;for(let i=0;i<n;i++){const t=i/n;p+=2*Math.PI*(180+1500*t*t)/sr;const x=rnd();l+=.1*(x-l);d[i]=(Math.sin(p)*.35+(x-l)*.5)*t*t}})],
 glitch:['Glitch',()=>synth(.55,(d,sr,n)=>{const s=Math.floor(sr*.03);let m=0,f=400,p=0;for(let i=0;i<n;i++){if(i%s===0){m=Math.floor(Math.random()*3);f=200+Math.random()*1600}p+=f/sr;d[i]=m===0?((p%1)<.5?.45:-.45):m===1?rnd()*.4:0}})],
 heart:['Heartbeat',()=>synth(1,(d,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr;let s=0;[0,.28].forEach((t0,k)=>{if(t>=t0){const u=t-t0;s+=(Math.sin(2*Math.PI*52*u)+.5*Math.sin(2*Math.PI*78*u))*Math.exp(-u*14)*(k?.7:1)}});d[i]=s*.75}})],
 chime:['Chime',()=>synth(2.6,(d,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr;d[i]=(Math.sin(2*Math.PI*880*t)+.6*Math.sin(2*Math.PI*1318.5*t)+.4*Math.sin(2*Math.PI*1760*t))*Math.exp(-t*2.6)*.3*Math.min(1,t*200)}})],
 pop:['Pop',()=>synth(.18,(d,sr,n)=>{let p=0;for(let i=0;i<n;i++){const t=i/sr;p+=2*Math.PI*(200+800*Math.exp(-t*40))/sr;d[i]=Math.sin(p)*Math.exp(-t*28)*.8}})],
 ding:['Ding',()=>synth(1.4,(d,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr;d[i]=Math.sin(2*Math.PI*1568*t)*Math.exp(-t*4)*.4}})],
 laugh:['Rimshot',()=>synth(.9,(d,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr;let s=0;[0,.16,.36].forEach((t0,k)=>{if(t>=t0){const u=t-t0;s+=(k<2?Math.sin(2*Math.PI*180*u)*Math.exp(-u*30):rnd()*Math.exp(-u*5)*.6)}});d[i]=s*.6}})]
};
const sfxCache={};function sfxBuf(k){audio();return sfxCache[k]||(sfxCache[k]=SFX[k][1]())}
const BEDS={
 drone:['Dark drone',()=>synth(8,(d,sr,n)=>{let l=0;for(let i=0;i<n;i++){const t=i/sr,o=.6+.4*Math.sin(2*Math.PI*.25*t),x=rnd();l+=.02*(x-l);d[i]=(Math.sin(2*Math.PI*55*t)*.5+Math.sin(2*Math.PI*82.5*t)*.25*o+Math.sin(2*Math.PI*110*t)*.15*(1-o)+l*.6)*.55}})],
 pulse:['Pulse beat',()=>synth(8,(d,sr,n)=>{let l=0;for(let i=0;i<n;i++){const t=i/sr,b=t%.5,h=(t+.25)%.5;let s=Math.sin(2*Math.PI*(45+70*Math.exp(-b*30))*b)*Math.exp(-b*9)*.8;const x=rnd();l+=.5*(x-l);s+=(x-l)*Math.exp(-h*60)*.25+Math.sin(2*Math.PI*55*t)*.12*Math.exp(-b*3);d[i]=s*.8}})],
 heart:['Heartbeat bed',()=>synth(8,(d,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr,b=t%1;let s=0;[0,.28].forEach((t0,k)=>{if(b>=t0){const u=b-t0;s+=(Math.sin(2*Math.PI*50*u)+.5*Math.sin(2*Math.PI*75*u))*Math.exp(-u*12)*(k?.6:1)}});d[i]=(s+Math.sin(2*Math.PI*41.25*t)*.08)*.7}})],
 bounce:['Funny bounce',()=>synth(8,(d,sr,n)=>{const notes=[262,330,392,330,294,349,440,349];for(let i=0;i<n;i++){const t=i/sr,b=t%.5,k=Math.floor(t/.5)%8,f=notes[k];d[i]=(Math.sin(2*Math.PI*f*t)*.3*Math.exp(-b*6)+Math.sin(2*Math.PI*(f/2)*t)*.2*Math.exp(-((t+.25)%.5)*10))*.7}})]
};

/* ---------- state ---------- */
const P={w:1080,h:1920,fit:'fill',clips:[],items:[],music:null,musicName:'',vMusic:.35,duck:true,voice:null,voiceName:'',vVoice:1,vClips:1,mark:'',fps:30,bitrate:8e6,ttsKey:''};
let uid=0,sel=null,tool='media',T=0,pps=40;
const stage=$('#stage'),ctx=stage.getContext('2d');
const undoStack=[];
function snap(){undoStack.push(JSON.stringify({clips:P.clips.map(c=>({...c,el:null,_node:null,_g:null})),items:P.items.map(i=>({...i,img:null})),ref:{clips:P.clips.map(c=>c.el),imgs:P.items.map(i=>i.img)}},(k,v)=>k==='ref'?undefined:v));undoStack._refs=undoStack._refs||[];undoStack._refs.push({c:new Map(P.clips.map(c=>[c.id,c])),i:new Map(P.items.map(i=>[i.id,i]))});if(undoStack.length>30){undoStack.shift();undoStack._refs.shift()}}
function undo(){if(!undoStack.length){toast('Nothing to undo');return}const s=JSON.parse(undoStack.pop()),r=undoStack._refs.pop();
  P.clips=s.clips.map(c=>{const o=r.c.get(c.id);return Object.assign({},c,{el:o?o.el:null,_node:o?o._node:null,_g:o?o._g:null,file:o?o.file:null,thumb:o?o.thumb:c.thumb})}).filter(c=>c.el);
  P.items=s.items.map(i=>{const o=r.i.get(i.id);return Object.assign({},i,{img:o?o.img:null,buf:o?o.buf:null})});sel=null;refresh()}

/* ---------- timeline math ---------- */
const clen=c=>Math.max(.1,(c.out-c.in)/c.speed);
function layout(){let t=0;P.clips.forEach(c=>{c.start=t;t+=clen(c)});return t}
function total(){const t=layout();let m=t;P.items.forEach(i=>{if(i.end>m)m=i.end});if(P.voice&&P.voice.duration>m)m=P.voice.duration;return Math.max(m,.1)}
function clipAt(t){for(const c of P.clips){if(t>=c.start&&t<c.start+clen(c))return c}return P.clips[P.clips.length-1]&&t>=P.clips[P.clips.length-1].start?P.clips[P.clips.length-1]:null}

/* ---------- filters ---------- */
const FILTERS={none:['Original',''],vivid:['Vivid','saturate(1.5) contrast(1.1)'],noir:['Noir','grayscale(1) contrast(1.35) brightness(.95)'],vintage:['Vintage','sepia(.55) contrast(1.05) saturate(.9) brightness(1.05)'],warm:['Warm','sepia(.25) saturate(1.3) hue-rotate(-10deg)'],cool:['Cool','saturate(1.1) hue-rotate(15deg) brightness(1.03)'],fade:['Faded','contrast(.85) brightness(1.1) saturate(.8)'],goth:['Goth','saturate(.6) contrast(1.4) brightness(.85) hue-rotate(-15deg)'],blood:['Blood moon','sepia(.6) saturate(3) hue-rotate(-30deg) contrast(1.2)'],dream:['Dreamy','brightness(1.1) saturate(1.2) contrast(.9)'],invert:['Invert','invert(1)']};
const FX={none:'None',glow:'Glow',vhs:'VHS',glitch:'Glitch',grain:'Film grain',vignette:'Vignette',shake:'Shake',flash:'Flash pulse'};
const MOTIONS={none:'None',zoomin:'Zoom in',zoomout:'Zoom out',panl:'Pan left',panr:'Pan right'};
const TRANS={cut:'Cut',fade:'Fade',flash:'Flash',slide:'Slide',zoom:'Zoom',glitch:'Glitch'};

/* ---------- drawing ---------- */
const bgc=document.createElement('canvas'),bgx=bgc.getContext('2d');
const tmp=document.createElement('canvas'),tx=tmp.getContext('2d');
function dims(src){return src.videoWidth?[src.videoWidth,src.videoHeight]:[src.naturalWidth||src.width,src.naturalHeight||src.height]}
function drawMedia(g,W,H,c,p){
  const src=c.el,[sw,sh]=dims(src);if(!sw)return;
  let sc=1,ox=0;const m=c.motion;
  if(m==='zoomin')sc=1+.14*p;else if(m==='zoomout')sc=1.14-.14*p;else if(m==='panl'){sc=1.16;ox=.06-.12*p}else if(m==='panr'){sc=1.16;ox=-.06+.12*p}
  if(c.fx==='shake'){ox+=(Math.random()-.5)*.012;sc*=1.03}
  const fit=c.fit||P.fit;let base;
  if(fit==='fill')base=Math.max(W/sw,H/sh);else{
    bgc.width=Math.max(8,Math.round(W/36));bgc.height=Math.max(8,Math.round(H/36));const s=Math.max(bgc.width/sw,bgc.height/sh);

/* ---------- clip sync ---------- */

/* ---------- adding media ---------- */
async function addMedia(files){
  audio();const fs=[...files];if(!fs.length)return;snap();toast('Adding '+fs.length+'…');
  for(const f of fs){
    if(f.type.startsWith('video')){const v=document.createElement('video');v.playsInline=true;v.preload='auto';v.muted=false;v.src=URL.createObjectURL(f);
      await new Promise(r=>{v.onloadedmetadata=r;v.onerror=r});if(!v.duration||!isFinite(v.duration)){toast('Couldn’t open '+f.name);continue}
      v.currentTime=Math.min(.2,v.duration/2);await new Promise(r=>{v.onseeked=r;setTimeout(r,1500)});
      const th=document.createElement('canvas');th.width=72;th.height=128;const tg=th.getContext('2d'),[sw,sh]=dims(v),s=Math.max(72/sw,128/sh);tg.drawImage(v,(72-sw*s)/2,(128-sh*s)/2,sw*s,sh*s);
      v.addEventListener('seeked',()=>{if(!playing)draw()});
      P.clips.push({id:++uid,kind:'video',el:v,file:f,name:f.name,thumb:th.toDataURL('image/jpeg',.6),in:0,out:v.duration,dur:v.duration,speed:1,filter:'none',fx:'none',motion:'none',trans:'cut',vol:1,mute:false,flip:false,adj:{b:0,c:0,s:0}});
    }else if(f.type.startsWith('image')){const img=new Image();img.src=URL.createObjectURL(f);try{await img.decode()}catch(e){toast('Couldn’t open '+f.name);continue}
      P.clips.push({id:++uid,kind:'image',el:img,name:f.name,thumb:img.src,in:0,out:3,dur:600,speed:1,filter:'none',fx:'none',motion:'zoomin',trans:'fade',flip:false,adj:{b:0,c:0,s:0}});
    }else if(f.type.startsWith('audio')){try{const buf=await ac.decodeAudioData(await f.arrayBuffer());P.items.push({id:++uid,type:'voice',start:T,end:T+buf.duration,buf,name:f.name})}catch(e){toast('Couldn’t read '+f.name)}}
  }
  refresh();toast('Added. Tap a clip on the timeline to edit it.');
}

      '<div class="grid2"><div class="field"><label for="fitSel">Photo / clip fit</label><select id="fitSel"><option value="fill"'+(P.fit==='fill'?' selected':'')+'>Fill frame (crop)</option><option value="blur"'+(P.fit==='blur'?' selected':'')+'>Whole picture, blurred edges</option></select></div>'+
      '<div class="field"><label for="markIn">Watermark</label><input type="text" id="markIn" placeholder="@handle or link" value="'+esc(P.mark)+'"></div></div>'+
      '<p class="hint">Tips: tap a clip in the timeline to trim, split, speed up or add effects. Drag text and stickers on the video. Use two fingers to resize and rotate them.</p>';
  }
  else if(tool==='edit'){
    if(!c){h='<h2>Edit</h2><p class="hint">Tap a clip in the timeline to edit it.</p>'}
    else{const max=c.kind==='video'?c.dur:60;
      h='<h2>Clip '+(P.clips.indexOf(c)+1)+' · '+esc(c.name).slice(0,28)+'</h2>'+
      '<div class="row"><button class="btn sm" id="cSplit">✂ Split at playhead</button><button class="btn sm" id="cLeft">◀ Move</button><button class="btn sm" id="cRight">Move ▶</button><button class="btn sm" id="cDup">⧉ Copy</button><button class="btn sm danger" id="cDel">✕ Delete</button></div>'+
      (c.kind==='video'?
      '<div class="grid2"><div class="field"><label for="cIn">Start trim · '+c.in.toFixed(1)+'s</label><input type="range" id="cIn" min="0" max="'+max.toFixed(2)+'" step="0.05" value="'+c.in+'"></div>'+
      '<div class="field"><label for="cOut">End trim · '+c.out.toFixed(1)+'s</label><input type="range" id="cOut" min="0" max="'+max.toFixed(2)+'" step="0.05" value="'+c.out+'"></div></div>'+
      '<div class="row"><button class="btn sm" id="cInPh">Start here (playhead)</button><button class="btn sm" id="cOutPh">End here (playhead)</button></div>'
      :'<div class="field"><label for="cDur">Seconds on screen</label><input type="number" id="cDur" min="0.3" max="60" step="0.1" value="'+(c.out-c.in).toFixed(1)+'"></div>')+
      '<div class="lbl">Speed</div><div class="chips">'+[.25,.5,1,1.5,2,3].map(s=>'<button class="chip" data-speed="'+s+'" aria-pressed="'+(c.speed===s)+'">'+s+'×</button>').join('')+'</div>'+
      '<div class="grid2"><div class="field"><label for="cMot">Motion</label><select id="cMot">'+opts(MOTIONS,c.motion)+'</select></div>'+
      '<div class="field"><label for="cTr">Transition in</label><select id="cTr">'+opts(TRANS,c.trans)+'</select></div>'+
      '<div class="field"><label for="cFit">Fit</label><select id="cFit"><option value="">Project default</option><option value="fill"'+(c.fit==='fill'?' selected':'')+'>Fill (crop)</option><option value="blur"'+(c.fit==='blur'?' selected':'')+'>Whole, blurred edges</option></select></div></div>'+
      '<label class="check"><input type="checkbox" id="cFlip"'+(c.flip?' checked':'')+'> Mirror / flip</label>'+
      (c.kind==='video'?'<div class="grid2"><div class="field"><label for="cVol">Clip volume</label><input type="range" id="cVol" min="0" max="2" step="0.05" value="'+(c.vol??1)+'"></div><label class="check"><input type="checkbox" id="cMute"'+(c.mute?' checked':'')+'> Mute this clip</label></div>':'')+
      '<div class="lbl">Adjust</div><div class="grid2">'+['b','c','s'].map(k=>'<div class="field"><label for="adj'+k+'">'+{b:'Brightness',c:'Contrast',s:'Saturation'}[k]+'</label><input type="range" id="adj'+k+'" min="-60" max="60" step="1" value="'+c.adj[k]+'"></div>').join('')+'</div>';
    }
  }
  else if(tool==='text'){
    const t=it&&it.type==='text'?it:null;
    h='<h2>Text</h2><div class="row"><button class="btn primary" id="tAdd">＋ Add text at playhead</button>'+(t?'<button class="btn sm" id="tDup">⧉ Copy</button><button class="btn sm danger" id="tDel">✕ Delete</button>':'')+'</div>';
    h+='<div class="lbl">Quick styles</div><div class="chips">'+Object.keys(STYLES).map(k=>'<button class="chip" data-style="'+k+'">'+STYLES[k].label+'</button>').join('')+'</div>';
    if(t){h+='<div class="field"><label for="tTxt">Words</label><textarea id="tTxt" rows="2">'+esc(t.text)+'</textarea></div>'+
      '<div class="grid2"><div class="field"><label for="tFont">Font</label><select id="tFont">'+Object.keys(FONTS).map(f=>'<option'+(f===t.font?' selected':'')+'>'+f+'</option>').join('')+'</select></div>'+

      '<div class="field"><label for="tColor">Color</label><input type="color" id="tColor" value="'+(t.color||'#ffffff')+'"></div>'+
      '<div class="field"><label for="tStroke">Outline</label><select id="tStroke"><option value="">None</option><option value="#000000"'+(t.stroke==='#000000'?' selected':'')+'>Black</option><option value="#ffffff"'+(t.stroke==='#ffffff'?' selected':'')+'>White</option></select></div>'+
      '<div class="field"><label for="tBg">Background box</label><select id="tBg"><option value="">None</option><option value="rgba(0,0,0,.75)"'+(t.bg==='rgba(0,0,0,.75)'?' selected':'')+'>Black</option><option value="rgba(255,255,255,.9)"'+(t.bg==='rgba(255,255,255,.9)'?' selected':'')+'>White</option><option value="rgba(255,92,138,.9)"'+(t.bg==='rgba(255,92,138,.9)'?' selected':'')+'>Pink</option><option value="rgba(227,181,90,.92)"'+(t.bg==='rgba(227,181,90,.92)'?' selected':'')+'>Gold</option></select></div>'+
      '<div class="field"><label for="tGlow">Glow</label><select id="tGlow"><option value="">None</option><option value="#ff5c8a"'+(t.glow==='#ff5c8a'?' selected':'')+'>Neon pink</option><option value="#6fb8ff"'+(t.glow==='#6fb8ff'?' selected':'')+'>Neon blue</option><option value="#e3b55a"'+(t.glow==='#e3b55a'?' selected':'')+'>Gold</option><option value="#ff2a2a"'+(t.glow==='#ff2a2a'?' selected':'')+'>Blood red</option></select></div></div>'+
      '<div class="grid2"><div class="field"><label for="tSize">Size</label><input type="range" id="tSize" min="24" max="220" step="2" value="'+t.size+'"></div><div class="field"><label for="tRot">Rotate</label><input type="range" id="tRot" min="-45" max="45" step="1" value="'+(t.rot||0)+'"></div></div>'+

  }
  else if(tool==='captions'){
    h='<h2>Auto captions</h2><p class="hint">Listens to your clips and writes captions timed to the words. Uses a free Gemini key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Works in the installed app; inside Claude it can’t connect.</p>'+
      '<div class="field"><label for="capKey">Gemini API key</label><input type="password" id="capKey" placeholder="Paste key once" value="'+esc(store.get('oc_key_gemini'))+'"></div>'+
      '<div class="grid2"><div class="field"><label for="capStyle">Caption look</label><select id="capStyle">'+Object.keys(STYLES).map(k=>'<option value="'+k+'"'+(k==='bold'?' selected':'')+'>'+STYLES[k].label+'</option>').join('')+'</select></div>'+

      '<button class="btn primary" id="capGo">Make captions</button><span class="status" id="capStatus"></span>'+
      '<p class="hint">Or type them yourself: in Text, add one per line and set each one’s start and end.</p>'+
      '<div class="field"><label for="capManual">Quick manual captions (one line = one caption, spread evenly)</label><textarea id="capManual" rows="3" placeholder="First caption&#10;Second caption"></textarea></div><button class="btn" id="capManualGo">Add these captions</button>';
  }
  else if(tool==='stickers'){
    const s=it&&it.type==='sticker'?it:null;
    h='<h2>Stickers & logos</h2><div class="chips">'+EMOJI.map(e=>'<button class="emoji" data-emoji="'+e+'" aria-label="Add '+e+'">'+e+'</button>').join('')+'</div>'+

    if(s)h+='<div class="row"><button class="btn sm" id="sDup">⧉ Copy</button><button class="btn sm danger" id="sDel">✕ Delete</button></div>'+
      '<div class="grid2"><div class="field"><label for="sSize">Size</label><input type="range" id="sSize" min="40" max="900" step="5" value="'+s.size+'"></div><div class="field"><label for="sRot">Rotate</label><input type="range" id="sRot" min="-180" max="180" step="1" value="'+(s.rot||0)+'"></div>'+
      '<div class="field"><label for="sAnim">Animation</label><select id="sAnim">'+opts({none:'None',fade:'Fade in',pop:'Pop',bounce:'Bounce',drop:'Drop',slide:'Slide up'},s.anim)+'</select></div></div>'+timingHtml(s);
  }
  else if(tool==='filters'){
    if(!c){h='<h2>Filters & effects</h2><p class="hint">Tap a clip in the timeline first.</p>'}
    else h='<h2>Filters · clip '+(P.clips.indexOf(c)+1)+'</h2><div class="chips">'+Object.entries(FILTERS).map(([k,v])=>'<button class="chip" data-filter="'+k+'" aria-pressed="'+(c.filter===k)+'">'+v[0]+'</button>').join('')+'</div>'+
      '<h2>Effects</h2><div class="chips">'+Object.entries(FX).map(([k,v])=>'<button class="chip" data-fx="'+k+'" aria-pressed="'+(c.fx===k)+'">'+v+'</button>').join('')+'</div>'+
      '<button class="btn sm" id="fAll">Use this look on every clip</button>';
  }
  else if(tool==='audio'){
    const v=it&&(it.type==='sfx'||it.type==='voice')?it:null;
    h='<h2>Music</h2><div class="grid2"><div class="field"><label for="mSel">Background music</label><select id="mSel"><option value="">None</option>'+Object.entries(BEDS).map(([k,b])=>'<option value="'+k+'"'+(P.musicName===k?' selected':'')+'>Built-in: '+b[0]+'</option>').join('')+(P.musicName&&!BEDS[P.musicName]?'<option selected>'+esc(P.musicName)+'</option>':'')+'</select></div>'+
      '<div class="field"><label for="mVol">Music volume</label><input type="range" id="mVol" min="0" max="1" step="0.05" value="'+P.vMusic+'"></div></div>'+
      '<input type="file" class="picker" id="mFile" accept="audio/*" aria-label="Use my own song">'+
      '<label class="check"><input type="checkbox" id="mDuck"'+(P.duck?' checked':'')+'> Lower music while voice plays</label>'+
      '<div class="field"><label for="clipVol">All clip sound</label><input type="range" id="clipVol" min="0" max="2" step="0.05" value="'+P.vClips+'"></div>'+
      '<h2>Sound effects</h2><p class="hint">Tap to add at the playhead.</p><div class="chips">'+Object.entries(SFX).map(([k,s])=>'<button class="chip" data-sfx="'+k+'">'+s[0]+'</button>').join('')+'</div>'+
      '<h2>Voiceover</h2><div class="row"><button class="btn" id="micBtn">● Record at playhead</button></div><span class="status" id="micStatus"></span>'+
      '<div class="lbl">AI voice (same Gemini key)</div><div class="field"><textarea id="ttsTxt" rows="2" placeholder="Type what the voice should say"></textarea></div>'+
      '<div class="grid2"><div class="field"><label for="ttsVoice">Voice</label><select id="ttsVoice">'+GV.map(x=>'<option'+(x===store.get('oc_gvoice')?' selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label for="ttsStyle">Sounds like</label><input type="text" id="ttsStyle" placeholder="e.g. spooky whisper" value="'+esc(store.get('oc_style'))+'"></div></div>'+
      '<button class="btn" id="ttsGo">Make AI voice at playhead</button><span class="status" id="ttsStatus"></span>'+
      '<div class="field"><label for="vVol">Voice volume</label><input type="range" id="vVol" min="0" max="2" step="0.05" value="'+P.vVoice+'"></div>';
    if(v)h+='<h2>Selected sound</h2>'+(v.type==='sfx'?'<div class="field"><label for="sfxVol">Volume</label><input type="range" id="sfxVol" min="0" max="2" step="0.05" value="'+(v.vol??.9)+'"></div>':'')+
      '<div class="row"><button class="btn sm" id="aHere">Move to playhead</button><button class="btn sm danger" id="aDel">✕ Delete</button></div>';
  }
  else if(tool==='templates'){
    h='<h2>Templates</h2><p class="hint">Adds a styled title, ending call-to-action and look for your brand. Add your clips first, then tap a template.</p><div class="tpl">'+
      Object.entries(TPL).map(([k,t])=>'<button data-tpl="'+k+'"><b style="font-family:'+t.css+';color:'+t.color+'">'+t.name+'</b><small>'+t.note+'</small></button>').join('')+'</div>'+
      '<div class="field"><label for="tplLink">Link to show at the end</label><input type="text" id="tplLink" placeholder="e.g. payhip.com/dilaffing" value="'+esc(store.get('oc_tpl_link'))+'"></div>';
  }
  else if(tool==='export'){
    h='<h2>Export</h2><div class="grid2"><div class="field"><label for="eFps">Frame rate</label><select id="eFps"><option'+(P.fps===30?' selected':'')+'>30</option><option'+(P.fps===24?' selected':'')+'>24</option></select></div>'+
      '<div class="field"><label for="eQ">Quality</label><select id="eQ"><option value="8000000">High</option><option value="4500000">Medium (smaller)</option><option value="12000000">Max</option></select></div></div>'+
      '<p class="hint">It plays the whole video once while recording, so it takes as long as the video. Keep the screen on.</p>'+
      '<button class="btn primary big" id="expGo">Export video ('+fmt0(total())+')</button><button class="btn" id="expFrame">Save this frame as a picture</button><div class="result" id="expRes" hidden></div>';
  }
  panel.innerHTML=h;wirePanel(c,it);
}
function timingHtml(i){return '<div class="lbl">Timing</div><div class="grid2"><div class="field"><label for="iStart">Starts (sec)</label><input type="number" id="iStart" min="0" step="0.1" value="'+i.start.toFixed(1)+'"></div><div class="field"><label for="iEnd">Ends (sec)</label><input type="number" id="iEnd" min="0" step="0.1" value="'+i.end.toFixed(1)+'"></div></div>'+
  '<div class="row"><button class="btn sm" id="iStartPh">Start at playhead</button><button class="btn sm" id="iEndPh">End at playhead</button><button class="btn sm" id="iAll">Show whole video</button></div>'}

const STYLES={

  box:{label:'Black box',font:'Barlow',color:'#ffffff',bg:'rgba(0,0,0,.75)',size:72},
  neon:{label:'Neon pink',font:'Bungee',color:'#ffd1de',glow:'#ff5c8a',size:80},
  horror:{label:'Horror drip',font:'Creepster',color:'#ff2a2a',stroke:'#000000',size:110},
  mystic:{label:'Mystic gold',font:'Cinzel',color:'#f3d48a',glow:'#e3b55a',size:78},
  script:{label:'Pretty script',font:'Pacifico',color:'#ffffff',shadow:true,size:84},
  marker:{label:'Marker',font:'Permanent Marker',color:'#ffffff',stroke:'#000000',size:86},

};
const EMOJI=['💀','😈','🔥','❤️','🖤','✨','👻','🕷️','🦇','🔮','🌙','⭐','👑','💋','😂','🤣','😱','👽','🛸','🎃','🩸','⚡','💥','👉','⬇️','🛒','🤠','🐾'];

  ddm:{name:'Deadly My Darling',note:'Gothic pin-up',css:'Creepster',color:'#ff5c8a',title:'Deadly My Darling',font:'Creepster',tColor:'#ff5c8a',glow:'#ff2a2a',filter:'goth',fx:'vignette',music:'drone',cta:'Shop the collection',trans:'fade'},
  lou:{name:'Di Låffing',note:'Comedy · So funny it’s deadly',css:'Bungee',color:'#6fb8ff',title:'Di Låffing',font:'Bungee',tColor:'#ffffff',glow:'#6fb8ff',filter:'vivid',fx:'none',music:'bounce',cta:'So funny it’s deadly',trans:'zoom'},

  outlaw:{name:'Digital Outlaw',note:'Bold & gritty',css:'Anton',color:'#ff2a2a',title:'DIGITAL OUTLAW',font:'Anton',tColor:'#ffffff',glow:'#ff2a2a',filter:'noir',fx:'grain',music:'pulse',cta:'Made on my phone',trans:'glitch'},

  promo:{name:'Product promo',note:'Clean sale reel',css:'Barlow',color:'#ffe14d',title:'NEW DROP',font:'Anton',tColor:'#ffe14d',glow:'',filter:'vivid',fx:'none',music:'pulse',cta:'Link in bio 👉',trans:'slide'}
};

function newText(over){const st=STYLES.bold;return Object.assign({id:++uid,type:'text',text:'Your text',x:.5,y:.5,start:T,end:Math.min(T+3,Math.max(T+3,total())),scale:1,rot:0,anim:'pop',outFade:true,font:st.font,color:st.color,stroke:st.stroke,bg:'',glow:'',shadow:false,size:st.size},over||{})}
function applyStyle(t,k){const s=STYLES[k];Object.assign(t,{font:s.font,color:s.color,stroke:s.stroke||'',bg:s.bg||'',glow:s.glow||'',shadow:!!s.shadow,size:s.size});if(s.anim)t.anim=s.anim}

function wirePanel(c,it){
  bind('mediaIn','change',e=>{addMedia(e.target.files);e.target.value=''});
  bind('fitSel','change',e=>{P.fit=e.target.value;draw()});
  bind('markIn','input',e=>{P.mark=e.target.value;store.set('oc_mark',P.mark);draw()});
  if(c){
    bind('cSplit','click',splitAt);
    bind('cLeft','click',()=>{const i=P.clips.indexOf(c);if(i>0){snap();[P.clips[i-1],P.clips[i]]=[P.clips[i],P.clips[i-1]];refresh()}});
    bind('cRight','click',()=>{const i=P.clips.indexOf(c);if(i<P.clips.length-1){snap();[P.clips[i+1],P.clips[i]]=[P.clips[i],P.clips[i+1]];refresh()}});
    bind('cDup','click',()=>{snap();const d=dupClip(c);P.clips.splice(P.clips.indexOf(c)+1,0,d);refresh()});
    bind('cDel','click',()=>{snap();P.clips.splice(P.clips.indexOf(c),1);sel=null;refresh()});
    bind('cIn','input',e=>{c.in=Math.min(+e.target.value,c.out-.1);e.target.previousElementSibling.textContent='Start trim · '+c.in.toFixed(1)+'s';T=c.start;renderTL();draw()});
    bind('cOut','input',e=>{c.out=Math.max(+e.target.value,c.in+.1);e.target.previousElementSibling.textContent='End trim · '+c.out.toFixed(1)+'s';layout();T=c.start+clen(c)-.05;renderTL();draw()});
    ['cIn','cOut'].forEach(id=>bind(id,'pointerdown',snap));
    bind('cInPh','click',()=>{if(T<c.start||T>c.start+clen(c)){toast('Move the playhead inside this clip first');return}snap();c.in=c.in+(T-c.start)*c.speed;refresh()});
    bind('cOutPh','click',()=>{if(T<c.start||T>c.start+clen(c)){toast('Move the playhead inside this clip first');return}snap();c.out=c.in+(T-c.start)*c.speed;refresh()});
    bind('cDur','change',e=>{snap();c.out=c.in+clamp(+e.target.value||3,.3,60);refresh()});
    panel.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{snap();c.speed=+b.dataset.speed;refresh()});
    bind('cMot','change',e=>{c.motion=e.target.value;draw()});bind('cTr','change',e=>{c.trans=e.target.value;T=c.start;draw();renderTL()});bind('cFit','change',e=>{c.fit=e.target.value;draw()});
    bind('cFlip','change',e=>{c.flip=e.target.checked;draw()});bind('cVol','input',e=>{c.vol=+e.target.value;if(c._g)c._g.gain.value=c.mute?0:c.vol*P.vClips});bind('cMute','change',e=>{c.mute=e.target.checked;if(c._g)c._g.gain.value=c.mute?0:(c.vol??1)*P.vClips});
    ['b','c','s'].forEach(k=>bind('adj'+k,'input',e=>{c.adj[k]=+e.target.value;draw()}));
    panel.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{c.filter=b.dataset.filter;renderPanel();draw()});
    panel.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{c.fx=b.dataset.fx;renderPanel();draw()});
    bind('fAll','click',()=>{snap();P.clips.forEach(x=>{x.filter=c.filter;x.fx=c.fx});toast('Look applied to all clips');draw()});
  }
  // text
  bind('tAdd','click',()=>{snap();const t=newText();P.items.push(t);sel={kind:'item',id:t.id};refresh();setTimeout(()=>{const x=$('#tTxt');if(x){x.focus();x.select()}},50)});
  panel.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{let t=it&&it.type==='text'?it:null;snap();if(!t){t=newText();P.items.push(t);sel={kind:'item',id:t.id}}applyStyle(t,b.dataset.style);refresh()});
  if(it&&it.type==='text'){
    bind('tTxt','input',e=>{it.text=e.target.value;draw();renderTLSoon()});
    bind('tFont','change',e=>{it.font=e.target.value;draw()});bind('tAnim','change',e=>{it.anim=e.target.value;T=it.start;draw()});
    bind('tColor','input',e=>{it.color=e.target.value;draw()});bind('tStroke','change',e=>{it.stroke=e.target.value;draw()});bind('tBg','change',e=>{it.bg=e.target.value;draw()});bind('tGlow','change',e=>{it.glow=e.target.value;draw()});
    bind('tSize','input',e=>{it.size=+e.target.value;draw()});bind('tRot','input',e=>{it.rot=+e.target.value;draw()});

  bind('mVol','input',e=>P.vMusic=+e.target.value);bind('mDuck','change',e=>P.duck=e.target.checked);bind('vVol','input',e=>P.vVoice=+e.target.value);

let pv=null;function preview(buf,vol){audio();if(pv)try{pv.stop()}catch(e){}const s=ac.createBufferSource();s.buffer=buf;const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start();if(buf.duration>6)s.stop(ac.currentTime+6);pv=s}
function dupClip(c){const d=Object.assign({},c,{id:++uid,adj:{...c.adj},_node:null,_g:null});if(c.kind==='video'){const v=document.createElement('video');v.playsInline=true;v.preload='auto';v.src=c.el.src;v.addEventListener('seeked',()=>{if(!playing)draw()});d.el=v}return d}

/* ---------- mic ---------- */
let micRec=null;
async function recordMic(){audio();const st=$('#micStatus');
  if(micRec){micRec.stop();return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){st.textContent='The mic is blocked here. It works in the installed app. Or add a voice memo with ＋ Media.';st.className='status err';return}
  const at=T,chunks=[];micRec=new MediaRecorder(stream);micRec.ondataavailable=ev=>ev.data.size&&chunks.push(ev.data);
  micRec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());micRec=null;try{const buf=await ac.decodeAudioData(await new Blob(chunks).arrayBuffer());snap();P.items.push({id:++uid,type:'voice',start:at,end:at+buf.duration,buf,name:'Recording'});st.textContent='Voiceover added at '+fmt(at);st.className='status good';renderTL();renderPanel()}catch(e){st.textContent='Couldn’t read the recording. Try again.';st.className='status err'}};
  micRec.start();$('#micBtn').textContent='■ Stop';st.textContent='Recording… talk now.';st.className='status';if(P.clips.length&&!playing)startPlay(at);
}

/* ---------- Gemini: TTS + captions ---------- */
function gkey(){const k=store.get('oc_key_gemini');if(!k)throw new Error('Paste your free Gemini key in Captions first.');return k}
function netErr(e){return e instanceof TypeError?new Error('Can’t reach Google from inside Claude. Use the installed Outlaw Cut app for this.'):e}
async function tts(text){audio();const key=gkey(),style=store.get('oc_style');const body=JSON.stringify({contents:[{parts:[{text:style?'Say this '+style+': '+text:text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:store.get('oc_gvoice')||'Kore'}}}}});
  let last='';for(const m of ['gemini-2.5-flash-preview-tts','gemini-3.1-flash-tts-preview']){let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body})}catch(e){throw netErr(e)}
    const j=await r.json().catch(()=>({}));if(!r.ok){last=(j.error&&j.error.message)||'Error '+r.status;if(r.status<429)break;continue}
    const part=j.candidates&&j.candidates[0].content.parts.find(p=>p.inlineData);if(!part){last='No audio came back.';continue}
    const rate=+((/rate=(\d+)/.exec(part.inlineData.mimeType||'')||[])[1]||24000),bin=atob(part.inlineData.data),n=bin.length>>1,buf=ac.createBuffer(1,n,rate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;d[i]=v/32768}return buf}
  throw new Error(/quota|429|exhaust/i.test(last)?'Free daily voice limit reached. Try tomorrow.':last||'Voice failed.')}
function wavB64(buf){const sr=buf.sampleRate,d=buf.getChannelData(0),n=d.length,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,clamp(d[i],-1,1)*32767,true);const u=new Uint8Array(ab);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
async function autoCaptions(){
  const st=$('#capStatus');const set=(m,c)=>{st.textContent=m;st.className='status '+(c||'')};
  try{const key=gkey();audio();layout();const vids=P.clips.filter(c=>c.kind==='video'&&c.file);if(!vids.length&&!P.voice&&!P.items.some(i=>i.type==='voice'))throw new Error('Add a video with talking (or a voiceover) first.');
    const tot=Math.min(total(),300),SR=16000,off=new OfflineAudioContext(1,Math.ceil(tot*SR),SR);set('Listening to your audio…');
    for(const c of vids){if(c.start>=tot)continue;let b;try{b=await ac.decodeAudioData(await c.file.arrayBuffer())}catch(e){continue}const s=off.createBufferSource();s.buffer=b;s.playbackRate.value=c.speed;s.connect(off.destination);s.start(c.start,c.in,c.out-c.in)}
    P.items.forEach(i=>{if(i.type==='voice'&&i.buf&&i.start<tot){const s=off.createBufferSource();s.buffer=i.buf;s.connect(off.destination);s.start(i.start)}});
    if(P.voice){const s=off.createBufferSource();s.buffer=P.voice;s.connect(off.destination);s.start(0)}
    const rendered=await off.startRendering();set('Writing captions…');
    const prompt='Transcribe all speech in this audio into short on-screen captions of 2 to 6 words each. Return ONLY a JSON array like [{"start":0.0,"end":1.4,"text":"..."}] with times in seconds from the start of the audio. Keep the speaker\'s exact words, add punctuation, no speaker names.';
    let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:'audio/wav',data:wavB64(rendered)}},{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})})}catch(e){throw netErr(e)}
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||'Error '+r.status);
    let txt=j.candidates[0].content.parts.map(p=>p.text||'').join('');txt=txt.slice(txt.indexOf('['),txt.lastIndexOf(']')+1);const segs=JSON.parse(txt);
    if(!segs.length)throw new Error('No speech found.');snap();P.items=P.items.filter(i=>!i.autocap);const styleK=$('#capStyle').value,y=+$('#capPos').value;
    segs.forEach(s=>{const t=newText({autocap:1,text:String(s.text||'').trim(),start:+s.start||0,end:Math.max((+s.end||0),(+s.start||0)+.4),y,anim:'pop',outFade:false});applyStyle(t,styleK);t.size=Math.min(t.size,84);if(t.text)P.items.push(t)});
    refresh();set(segs.length+' captions added. Tap any to fix a word.','good');
  }catch(e){set(e.message||'Captions failed','err')}
}

/* ---------- export ---------- */
let dlCap,cancel=false;
async function saveBlob(blob,name){
  if(window.claude&&window.claude.use){try{if(dlCap===undefined)dlCap=await window.claude.use('downloads');if(dlCap){await dlCap.save({filename:name,data:blob});toast('Saved '+name);return}}catch(e){if(e&&e.code==='declined'){toast('Save cancelled');return}}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);toast('Saved '+name)}
function pickMime(){if(!window.MediaRecorder)return null;for(const m of ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ''}
let wake=null;async function awake(on){try{if(on&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen');else if(wake){await wake.release();wake=null}}catch(e){}}
function busy(on,title){$('#busy').hidden=!on;if(title)$('#busyTitle').textContent=title;$('#busyBar').style.width='0%';$('#busyTime').textContent=''}
$('#busyCancel').onclick=()=>{cancel=true;if(playing)stopPlay(false)};
async function exportVideo(){
  if(!P.clips.length){toast('Add clips first');return}if(playing)stopPlay(false);
  const mime=pickMime();if(mime===null){toast('This browser can’t record video. Use Chrome.');return}
  await fontsReady;audio();ensureNodes();cancel=false;const prevSel=sel;sel=null;busy(true,'Exporting your video…');awake(true);
  const dest=ac.createMediaStreamDestination();mix.connect(dest);const vs=stage.captureStream(P.fps);
  const rec=new MediaRecorder(new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]),mime?{mimeType:mime,videoBitsPerSecond:P.bitrate,audioBitsPerSecond:192000}:{videoBitsPerSecond:P.bitrate});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const stopped=new Promise(r=>rec.onstop=r);
  try{T=0;layout();render(0);rec.start(500);
    await startPlay(0,(t,tot)=>{$('#busyBar').style.width=(t/tot*100)+'%';$('#busyTime').textContent=fmt0(t)+' / '+fmt0(tot)});
    await sleep(250);
  }finally{rec.stop();await stopped;try{mix.disconnect(dest)}catch(e){}vs.getTracks().forEach(t=>t.stop());busy(false);awake(false);sel=prevSel}
  if(cancel){toast('Export cancelled');return}
  const type=rec.mimeType||mime||'video/webm',ext=type.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type}),name='outlaw-cut-pro-'+new Date().toISOString().slice(0,10)+'.'+ext;
  const box=$('#expRes');if(box){box.hidden=false;box.innerHTML='';const v=document.createElement('video');v.src=URL.createObjectURL(blob);v.controls=true;v.playsInline=true;const b=document.createElement('button');b.className='btn primary';b.textContent='Save '+name;b.onclick=()=>saveBlob(blob,name);
    const p=document.createElement('p');p.className='hint';p.textContent=(blob.size/1048576).toFixed(1)+' MB'+(ext==='webm'?' · WEBM works on TikTok and YouTube. For Instagram, convert to MP4.':'');box.append(v,b,p)}
  await saveBlob(blob,name);
}
async function saveFrame(){const c=document.createElement('canvas');c.width=P.w;c.height=P.h;layout();render(T,P.w,P.h,c.getContext('2d'));const b=await new Promise(r=>c.toBlob(r,'image/png'));saveBlob(b,'outlaw-frame-'+fmt0(T).replace(':','-')+'.png')}

  P.items.push(newText({text:'Drag me anywhere',y:.2,start:0,end:7.5,anim:'pop',font:'Bungee',color:'#ffd1de',glow:'#ff5c8a',stroke:'',size:76}));
  P.items.push(newText({text:'Tap ＋ Media to start your own',y:.8,start:2.5,end:7.5,anim:'words',bg:'rgba(0,0,0,.72)',stroke:'',size:60}));
}
demo();T=1.2;
const realAdd=addMedia;addMedia=async function(f){if(P.clips.some(c=>c.example)){P.clips=P.clips.filter(c=>!c.example);P.items=[];undoStack.length=0;if(undoStack._refs)undoStack._refs.length=0;T=0}return realAdd(f)};
